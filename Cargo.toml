[package]
name = "mediabox"
version = "0.1.0"
edition = "2021"
description = "Archive and deduplicate files by date"
license = "MIT"

[dependencies]
blake3 = "1.5"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
image = "0.25"
thiserror = "2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"
